# Format, lint, typecheck, test and build on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# No GitHub API calls are made, so no token permissions are needed.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The browser is ~95 MB and changes only when Playwright does, so it is keyed on
      # the resolved version rather than downloaded on every run.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser is installed but its system libraries are not cached with it.
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
